# Source: karpenter-dependencies/templates/nodeclass.yml
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.team }}-nodeclass
spec:
  # Required, discovers subnets to attach to instances
  # Each term in the array of subnetSelectorTerms is ORed together
  # Within a single term, all conditions are ANDed
  subnetSelectorTerms:
    # Select on any subnet that has the "karpenter.sh/discovery: ${CLUSTER_NAME}"
    # AND the "environment: test" tag OR any subnet with ID "subnet-09fa4a0a8f233a921"
    {{- range .Values.subnet.ids }}
    - id: {{ . }}
    {{- end }}

  # Required, discovers security groups to attach to instances
  # Each term in the array of securityGroupSelectorTerms is ORed together
  # Within a single term, all conditions are ANDed
  securityGroupSelectorTerms:
    # Select on any security group that has both the "karpenter.sh/discovery: ${CLUSTER_NAME}" tag
    # AND the "environment: test" tag OR any security group with the "my-security-group" name
    # OR any security group with ID "sg-063d7acfb4b06c82c"
    {{- range .Values.securityGroup.ids }}
    - id: {{ . }}
    {{- end }}

  # Optional, IAM role to use for the node identity.
  # Must specify one of "role" or "instanceProfile" for Karpenter to launch nodes
  role: {{ .Values.iamRoleName.node }} ##To correct .. make this IAM Role, use an existing one

  # Each term in the array of amiSelectorTerms is ORed together
  # Within a single term, all conditions are ANDed
  amiSelectorTerms:
    # Select on any AMI that has both the `karpenter.sh/discovery: ${CLUSTER_NAME}`
    # AND `environment: test` tags OR any AMI with the name `my-ami` OR an AMI with
    # ID `ami-123` OR an AMI with ID matching the value of my-custom-parameter
    # Select EKS optimized AL2023 AMIs with version `v20240703`. This term is mutually
    # exclusive and can't be specified with other terms.
    - alias: {{ .Values.ami.aliasName }}@{{ .Values.ami.pinnedVersion }} ##Minimal overhead and contains bare minimum

#   # Optional, the terms are exclusive
#   placementGroupSelector:
#     name: my-pg
#     id: pg-123

#   # Optional, propagates tags to underlying EC2 resources
#   tags:
#     team: team-a
#     app: team-a-app

  # Optional, configures IMDS for the instance
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1 # This is changed to disable IMDS access from containers not on the host network
    httpTokens: {{- if .Values.imdsV2Required }} "required" {{- else }}  "optional" {{- end }}
  # Optional, configures ENI Connection Tracking timeouts.
  # Omit entirely to use EC2 defaults. Only set fields you want to override.
  # connectionTracking:
  #   # Optional, configures timeout (in seconds) for idle TCP connections.
  #   tcpEstablishedTimeout: 300 # lower than the EC2 default of 432000 (5 days)
  #   # Optional, configures timeout (in seconds) for idle UDP stream flows.
  #   udpStreamTimeout: 120
  #   # Optional, configures timeout (in seconds) for idle unidirectional or single-transaction UDP flows.
  #   udpTimeout: 45

    #PVC's used for dynamic provisioning for stateful workloads
#   # Optional, configures storage devices for the instance
#   blockDeviceMappings:
#     - deviceName: /dev/xvda
#       ebs:
#         volumeSize: 100Gi
#         volumeType: gp3
#         iops: 10000
#         encrypted: true
#         kmsKeyID: "1234abcd-12ab-34cd-56ef-1234567890ab"
#         deleteOnTermination: true
#         throughput: 125
#         snapshotID: snap-0123456789
#         volumeInitializationRate: 100

#   # Optional, configures the network interfaces for the instance
#   networkInterfaces:
#     - networkCardIndex: 0
#       deviceIndex: 0
#       interfaceType: "interface"
#     - networkCardIndex: 0
#       deviceIndex: 1
#       interfaceType: "interface"

#   # Optional, overrides autogenerated userdata with a merge semantic
#   userData: |
#     echo "Hello world"    

  # Optional, configures detailed monitoring for the instance
  detailedMonitoring: {{ .Values.detailedMonitoring }}

  # Optional, configures if the instance should be launched with an associated public IP address.
  # If not specified, the default value depends on the subnet's public IP auto-assign setting.
  associatePublicIPAddress: {{ .Values.associatePublicIPAddress }}