apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.team }}-{{ .Values.environment }}
  labels: {{ toYamlPretty .Values.labels | nindent 4}}
  name: {{ .Chart.Name }}-preview-service
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/sync-options: ServerSideApply=false #https://github.com/argoproj/argo-rollouts/issues/3437
spec:
{{- with .Values.service }}
  type: {{ .type }}
  ports:
    - name: {{ .port.name }}
      port: {{ .port.number }}
      protocol: {{ .protocol }}
      targetPort: {{ .targetPort }}
{{- end }}
  selector: {{ toYamlPretty .Values.labels | nindent 4 }}