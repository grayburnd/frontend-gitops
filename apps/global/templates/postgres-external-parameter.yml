apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresExternalParameter.name }}
  namespace: {{ .Values.team }}-{{ .Values.environment }}
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: {{ .Values.postgresExternalParameter.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.postgresExternalParameter.name }}
    manifest:
      apiVersion: v1
      kind: ConfigMap ##Creates a configmap instead of a secret
  dataFrom:
    - extract: 
        key: {{ .Values.redisExternalParameter.name }}