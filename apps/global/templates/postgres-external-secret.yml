apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresExternalSecret.name }}
  namespace: {{ .Values.team }}-{{ .Values.environment }}
spec:
  refreshPolicy: OnChange
  target:
    name: {{ .Values.postgresExternalSecret.name }}
    # keep the Secret if this postgresExternalSecret is ever deleted
    creationPolicy: Orphan
    # never rewrite the Secret data once it exists, even on recreation
    immutable: false
  dataFrom:
    # This grabs EVERY secret key value pair under the specified secret.
    - extract:
        key: {{ .Values.postgresExternalSecret.name }}
      sourceRef:
        storeRef:
          name: {{ .Values.postgresExternalSecret.storeRef }}
          kind: ClusterSecretStore