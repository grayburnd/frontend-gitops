apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-http-route
  namespace: {{ .Values.team }}-{{ .Values.environment }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: http
      namespace: {{ .Values.gateway.namespace }}
  rules:
    - backendRefs:
        - name: {{ .Chart.Name }}-service
          port: {{ .Values.service.port }}
      matches: {{ toYamlPretty .Values.httpRoute.rules.matches | nindent 8 }}
      {{- with .Values.httpRoute.rules.filters }}
      filters: {{ toYamlPretty . | nindent 8 }}
      {{- end }}