name: CI [Lint]

on:
  pull_request:
permissions:
  contents: read
  pull-requests: read ##GitLeaks required.
jobs:
  ci-lint-and-checks:
    environment:
      name: prod
      deployment: false
    runs-on: ubuntu-latest
    steps:

      - name: Checkout local Git Repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          # required
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Helm values repo
        uses: actions/checkout@v7.0.1
        with:
          repository: grayburnd/private-gitops-values
          token: ${{ steps.app-token.outputs.token }}
          ref: 'main'
          path: values

      - name: Install kubetools
        uses: yokawasa/action-setup-kube-tools@v0.13.5

      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Helm lint all k8s manifests
        run: |
            ./scripts/lint.sh \
              "${{ vars.TARGET_LINT_DIRECTORIES }}" \
              "${{ vars.TEAM }}" \
              "${{ vars.ENVIRONMENT }}" \
              "false"
    
#We use -ignore-missing-schemas to exclude custom CRDs for simplicity/demo purposes
#We use -strict to disallow additional properties not in schema or duplicated keys
      - name: Kubeconform validate all app manifests
        run: |
          ./scripts/lint.sh \
            "${{ vars.TARGET_LINT_DIRECTORIES }}" \
            "${{ vars.TEAM }}" \
            "${{ vars.ENVIRONMENT }}" \
            "true"
