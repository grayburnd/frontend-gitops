apiVersion: argoproj.io/v1alpha1 ##See if can take either helm 3rd party with own apps or just one of them. May need seperate appset.
kind: ApplicationSet
metadata:
  name: appset
  namespace: frontend-prod ##Only for Prod
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix: #Used to create seperate env for every app folder detected
        generators:
          - git:
              repoURL: https://github.com/grayburnd/frontend-gitops.git
              revision: HEAD
              directories:
                - path: apps/*   
          - list:
              elements:
              - env: prod
                team: frontend
                cluster: https://kubernetes.default.svc
                repoURL: https://github.com/grayburnd/frontend-gitops.git
                valuesRepoURL: https://github.com/grayburnd/private-gitops-values.git

  template:      
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .env }}' 
    spec:
      # The project the application belongs to.
      project: '{{ .team }}'
      # Source of the application manifests
      sources:
        - repoURL: '{{ .repoURL }}'
          path: '{{ .path.path }}'
          targetRevision: HEAD ##Check
          helm:
            valueFiles:
              - $values/{{ .team }}-gitops/{{ .path.path }}/{{ .env }}-values.yml
        - repoURL: '{{ .valuesRepoURL }}'
          targetRevision: HEAD
          ref: values   
      # Destination cluster and namespace to deploy the application
      destination:
        server: '{{ .cluster }}'
        namespace: '{{ .team }}-{{ .env }}'
      # Sync policy
      syncPolicy:
        syncOptions:
          - ServerSideApply=true ##Useful for large resources i.e CRDs
          - ApplyOutOfSyncOnly=true  
        automated: # automated sync by default retries failed attempts 5 times with following delays between attempts ( 5s, 10s, 20s, 40s, 80s ); retry controlled using `retry` field.
          prune: true # Specifies if resources should be pruned during auto-syncing ( false by default ).
          selfHeal: true # Specifies if partial app sync should be executed when resources are changed only in target Kubernetes cluster and no git change detected ( false by default ).
      